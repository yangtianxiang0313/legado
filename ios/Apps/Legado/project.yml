name: Legado
options:
  bundleIdPrefix: com.yangtianxiang.legado
  deploymentTarget:
    iOS: "17.0"
packages:
  LegadoKit:
    path: ../../Packages/LegadoKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  LegadoApp:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: LegadoKit
        product: LegadoFullCompatKit
      - target: LegadoShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yangtianxiang.legado.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/LegadoApp.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
  LegadoShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
    dependencies:
      - package: LegadoKit
        product: LegadoShareInteropKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yangtianxiang.legado.app.share
        PRODUCT_NAME: LegadoShareExtension
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/LegadoShareExtension.entitlements
        SKIP_INSTALL: YES
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1,2"
  LegadoAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
      - path: ../../harness/fixtures/real-source/rs-wikisource-public-domain-001/source.json
        buildPhase: resources
    dependencies:
      - target: LegadoApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yangtianxiang.legado.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LegadoApp
schemes:
  LegadoApp:
    build:
      targets:
        LegadoApp: all
        LegadoShareExtension: all
        LegadoAppUITests:
          - test
    test:
      targets:
        - LegadoAppUITests
