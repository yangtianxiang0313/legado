name: Business Knowledge Publisher

on:
  push:
    branches:
      - "knowledge/request-**"

permissions:
  contents: write
  actions: read

concurrency:
  group: business-knowledge-publisher-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish one content-addressed knowledge batch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REQUEST_FILE: .business-knowledge-publication-request.json
    steps:
      - name: Checkout exact request commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          path: publisher
          persist-credentials: true
          ref: ${{ github.sha }}

      - name: Validate immutable request commit
        shell: bash
        run: |
          set -euo pipefail
          request="publisher/${REQUEST_FILE}"
          test -f "${request}"
          test ! -L "${request}"
          test "$(jq -r '.schema_version' "${request}")" = "1"
          test "$(jq -r '.kind' "${request}")" = \
            "business_knowledge_publication_request"
          test "$(jq -r '.repository' "${request}")" = \
            "${GITHUB_REPOSITORY,,}"
          test "$(jq -r '.workflow_path' "${request}")" = \
            ".github/workflows/business-knowledge-publisher.yml"
          source_sha="$(jq -r '.source_sha' "${request}")"
          test "${#source_sha}" -eq 40
          test "$(git -C publisher rev-parse "${GITHUB_SHA}^")" = \
            "${source_sha}"
          actual_delta="$(
            git -C publisher diff-tree \
              --no-commit-id --name-only --no-renames -r \
              "${source_sha}" "${GITHUB_SHA}"
          )"
          test "${actual_delta}" = "${REQUEST_FILE}"
          test -z "$(
            git -C publisher status \
              --porcelain=v1 --untracked-files=all
          )"
          execution_id="$(shasum -a 256 "${request}" | cut -d' ' -f1)"
          expected_branch="$(
            python3 - "${request}" <<'PY'
          import json
          import pathlib
          import sys
          request = json.loads(pathlib.Path(sys.argv[1]).read_text())
          batch = request["batch_id"]
          assert batch.startswith("KPUB-")
          print(
              "knowledge/request-"
              + batch.removeprefix("KPUB-").lower()
              + "-"
              + request["source_sha"]
          )
          PY
          )"
          test "${GITHUB_REF_NAME}" = "${expected_branch}"
          for pair in \
            packet_proposal:packet_proposal_sha256 \
            driver_proposal:driver_proposal_sha256 \
            golden_receipt:golden_receipt_sha256 \
            producer_work_item:producer_work_item_sha256 \
            producer_evidence:producer_evidence_sha256 \
            producer_checkpoint:producer_checkpoint_sha256
          do
            path_key="${pair%%:*}"
            digest_key="${pair##*:}"
            relative="$(jq -r --arg key "${path_key}" '.[$key]' "${request}")"
            expected="$(jq -r --arg key "${digest_key}" '.[$key]' "${request}")"
            test -f "publisher/${relative}"
            test ! -L "publisher/${relative}"
            test "$(shasum -a 256 "publisher/${relative}" | cut -d' ' -f1)" = \
              "${expected}"
          done
          run_json="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          )"
          test "$(jq -r '.event' <<<"${run_json}")" = "push"
          test "$(jq -r '.head_sha' <<<"${run_json}")" = "${GITHUB_SHA}"
          test "$(jq -r '.head_branch' <<<"${run_json}")" = \
            "${GITHUB_REF_NAME}"
          test "$(jq -r '.run_attempt' <<<"${run_json}")" = \
            "${GITHUB_RUN_ATTEMPT}"
          {
            printf 'SOURCE_SHA=%s\n' "${source_sha}"
            printf 'EXECUTION_ID=%s\n' "${execution_id}"
            printf 'PUBLISHED_AT=%s\n' "$(jq -r '.created_at' <<<"${run_json}")"
          } >>"${GITHUB_ENV}"

      - name: Stage deterministic publication transaction
        shell: bash
        run: |
          set -euo pipefail
          request="publisher/${REQUEST_FILE}"
          mapfile -t requirement_refs < <(
            jq -r '.requirement_refs[]' "${request}"
          )
          requirement_args=()
          for reference in "${requirement_refs[@]}"
          do
            requirement_args+=(--requirement-ref "${reference}")
          done
          output="${RUNNER_TEMP}/business-knowledge-release"
          python3 -B publisher/ios/publisher/business_knowledge_publisher.py \
            prepare \
            --root publisher \
            --source-commit "${GITHUB_SHA}" \
            --authorized-run-id "${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}" \
            --packet-proposal "$(jq -r '.packet_proposal' "${request}")" \
            --packet-proposal-sha256 \
              "$(jq -r '.packet_proposal_sha256' "${request}")" \
            --driver-proposal "$(jq -r '.driver_proposal' "${request}")" \
            --driver-proposal-sha256 \
              "$(jq -r '.driver_proposal_sha256' "${request}")" \
            --golden-receipt "$(jq -r '.golden_receipt' "${request}")" \
            --golden-receipt-sha256 \
              "$(jq -r '.golden_receipt_sha256' "${request}")" \
            "${requirement_args[@]}" \
            --target-work-item \
              "$(jq -r '.target_work_item_id' "${request}")" \
            --approved-by "github-actions[bot]:${GITHUB_ACTOR_ID}" \
            --published-at "${PUBLISHED_AT}" \
            --output-dir "${output}" \
            | tee "${RUNNER_TEMP}/staging-report.json"

      - name: Install only the declared transaction
        shell: bash
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/business-knowledge-release"
          transaction="${output}/transaction.json"
          test "$(jq -r '.authority' "${transaction}")" = \
            "protected_business_knowledge"
          test "$(jq -r '.source_commit' "${transaction}")" = \
            "${GITHUB_SHA}"
          while IFS=$'\t' read -r relative digest
          do
            source_file="${output}/${relative}"
            test -f "${source_file}"
            test ! -L "${source_file}"
            test "$(shasum -a 256 "${source_file}" | cut -d' ' -f1)" = \
              "${digest}"
            install -D -m 0644 "${source_file}" "publisher/${relative}"
          done < <(
            jq -r '.install[] | [.path, .sha256] | @tsv' "${transaction}"
          )
          while IFS= read -r relative
          do
            test -f "publisher/${relative}"
            rm "publisher/${relative}"
          done < <(jq -r '.delete[]' "${transaction}")
          rm "publisher/${REQUEST_FILE}"
          actual="$(
            git -C publisher status \
              --porcelain=v1 --untracked-files=all \
              | awk '{print $2}' \
              | sort
          )"
          expected="$(
            {
              jq -r '.install[].path' "${transaction}"
              jq -r '.delete[]' "${transaction}"
              printf '%s\n' "${REQUEST_FILE}"
            } | sort
          )"
          test "${actual}" = "${expected}"

      - name: Commit and independently verify result
        shell: bash
        run: |
          set -euo pipefail
          transaction="${RUNNER_TEMP}/business-knowledge-release/transaction.json"
          mapfile -t changed < <(
            {
              jq -r '.install[].path' "${transaction}"
              jq -r '.delete[]' "${transaction}"
              printf '%s\n' "${REQUEST_FILE}"
            } | sort -u
          )
          git -C publisher config user.name "github-actions[bot]"
          git -C publisher config \
            user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C publisher add -A -- "${changed[@]}"
          git -C publisher commit \
            -m "chore(ios): publish business knowledge ${EXECUTION_ID}"
          result_commit="$(git -C publisher rev-parse HEAD)"
          test "$(git -C publisher rev-parse HEAD^)" = "${GITHUB_SHA}"
          test -z "$(
            git -C publisher status \
              --porcelain=v1 --untracked-files=all
          )"
          python3 -B \
            publisher/ios/harness/business-knowledge/business_knowledge.py \
            doctor --root publisher
          python3 -B publisher/ios/harness/harness.py \
            --root publisher doctor
          python3 -B publisher/ios/harness/demand_compiler.py \
            --root publisher plan \
            >"${RUNNER_TEMP}/demand-plan.json" || true
          jq -e '
            .blockers == []
            and all(
              .plans[];
              .state != "business_knowledge_publisher_required"
            )
          ' "${RUNNER_TEMP}/demand-plan.json"
          result_branch="$(
            python3 - "${RUNNER_TEMP}/business-knowledge-release/transaction.json" <<'PY'
          import os
          batch = os.environ["GITHUB_REF_NAME"].removeprefix(
              "knowledge/request-"
          )
          print("knowledge/result-" + batch)
          PY
          )"
          test -z "$(
            git -C publisher ls-remote origin \
              "refs/heads/${result_branch}"
          )"
          git -C publisher push \
            origin "${result_commit}:refs/heads/${result_branch}"
          {
            printf 'RESULT_COMMIT=%s\n' "${result_commit}"
            printf 'RESULT_BRANCH=%s\n' "${result_branch}"
          } >>"${GITHUB_ENV}"

      - name: Publish canonical result artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact="${RUNNER_TEMP}/publisher-result"
          mkdir -m 0700 "${artifact}"
          python3 - \
            "${artifact}/publisher-result.json" \
            "${artifact}/transaction.json" <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import sys
          request = json.loads(
              pathlib.Path("publisher/.business-knowledge-publication-request.json")
              .read_text()
          ) if pathlib.Path(
              "publisher/.business-knowledge-publication-request.json"
          ).exists() else None
          # The request was intentionally deleted from the result tree; recover it
          # from the parent request commit.
          if request is None:
              import subprocess
              payload = subprocess.check_output(
                  ["git", "-C", "publisher", "show",
                   f"{os.environ['GITHUB_SHA']}:.business-knowledge-publication-request.json"]
              )
              request = json.loads(payload)
          transaction = pathlib.Path(
              os.environ["RUNNER_TEMP"]
          ) / "business-knowledge-release/transaction.json"
          transaction_payload = (
              json.dumps(
                  json.loads(transaction.read_text()),
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
              )
              + "\n"
          ).encode("utf-8")
          pathlib.Path(sys.argv[2]).write_bytes(transaction_payload)
          report = {
              "schema_version": 1,
              "status": "published",
              "batch_id": request["batch_id"],
              "source_sha": request["source_sha"],
              "request_branch": os.environ["GITHUB_REF_NAME"],
              "request_commit": os.environ["GITHUB_SHA"],
              "result_branch": os.environ["RESULT_BRANCH"],
              "result_commit": os.environ["RESULT_COMMIT"],
              "publisher_run": {
                  "id": int(os.environ["GITHUB_RUN_ID"]),
                  "attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              },
              "transaction_sha256": hashlib.sha256(
                  transaction_payload
              ).hexdigest(),
              "execution_id": os.environ["EXECUTION_ID"],
          }
          pathlib.Path(sys.argv[1]).write_bytes(
              (
                  json.dumps(
                      report,
                      ensure_ascii=False,
                      sort_keys=True,
                      separators=(",", ":"),
                  )
                  + "\n"
              ).encode("utf-8")
          )
          PY
          (
            cd "${artifact}"
            for name in publisher-result.json transaction.json
            do
              shasum -a 256 "${name}"
            done >SHA256SUMS
          )

      - name: Upload result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: business-knowledge-result-${{ env.EXECUTION_ID }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publisher-result
          if-no-files-found: error
          retention-days: 30
